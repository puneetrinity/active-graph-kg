name: ActiveKG CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feat/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "16"

jobs:
  # ============================================================================
  # Job 1: Linting and Code Quality
  # ============================================================================
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Run ruff check
        run: |
          ruff check . --output-format=github

      - name: Run ruff format check
        run: |
          ruff format --check .

      - name: Enforce schema-control authority and caller census
        run: |
          python scripts/schema_control_guard.py
          python scripts/candidate_privacy_surface_guard.py

      - name: Run type checking
        run: |
          mypy activekg/ --ignore-missing-imports
        continue-on-error: true

  # ============================================================================
  # Job 2: Fast Unit Tests (No Database Required)
  # ============================================================================
  fast-unit-tests:
    name: Fast Unit Tests (No DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install -r requirements.txt

      - name: Run unit tests (no database)
        env:
          ACTIVEKG_TEST_NO_DB: "true"
          JWT_ENABLED: "false"
          CANDIDATE_PRIVACY_HMAC_ACTIVE_VERSION: "1"
          CANDIDATE_PRIVACY_HMAC_KEY_V1: "Y2ktb25seS1jYW5kaWRhdGUtcHJpdmFjeS1rZXktMzItYnl0ZXMtbWluaW11bQ=="
          CANDIDATE_PRIVACY_INTAKE_ENABLED: "false"
          CANDIDATE_PRIVACY_FLOW_ISSUER: "vantahire"
          CANDIDATE_PRIVACY_FLOW_ACTOR_ID: "vantahire-backend"
          CANDIDATE_PRIVACY_SIGNAL_ISSUER: "signal"
          CANDIDATE_PRIVACY_SIGNAL_ACTOR_ID: "signal-backend"
        run: |
          pytest \
            tests/test_security_limits.py \
            tests/test_embedding_provider.py \
            tests/test_global_candidate_embedding_text.py \
            tests/test_public_profile_boundary.py \
            tests/test_signal_global_observation_order.py \
            tests/test_jwt_scopes.py \
            tests/test_contact_suppression_authority.py \
            tests/test_public_observability_boundary.py \
            tests/test_schema_control.py \
            tests/test_candidate_privacy_identity.py \
            tests/test_candidate_privacy_authority.py \
            tests/test_candidate_privacy_api.py \
            tests/test_candidate_privacy_fences.py \
            tests/test_candidate_privacy_surface_guard.py \
            -v --tb=short --timeout=30
        continue-on-error: false

  # ============================================================================
  # Job 3: Unit Tests with Database (PG Matrix)
  # ============================================================================
  unit-tests:
    name: Unit Tests (PG ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["15", "16"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          pip install -r requirements.txt

      - name: Start runner-local PostgreSQL ${{ matrix.postgres }} with pgvector
        env:
          POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: |
          sudo systemctl stop postgresql || true
          if [ ! -f "/usr/share/postgresql/${POSTGRES_MAJOR}/extension/vector.control" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-common
            if [ ! -f /etc/apt/sources.list.d/pgdg.list ]; then
              sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            fi
            sudo apt-get update
            sudo apt-get install -y "postgresql-${POSTGRES_MAJOR}" "postgresql-${POSTGRES_MAJOR}-pgvector"
          fi
          while read -r version cluster _; do
            sudo pg_ctlcluster "$version" "$cluster" stop || true
          done < <(pg_lsclusters --no-header)
          if pg_lsclusters --no-header | awk -v version="$POSTGRES_MAJOR" \
            '$1 == version && $2 == "main" { found=1 } END { exit !found }'; then
            sudo pg_dropcluster --stop "$POSTGRES_MAJOR" main
          fi
          sudo pg_createcluster -p 5432 "$POSTGRES_MAJOR" main --start
          server_version_num="$(sudo -u postgres psql -d postgres -Atqc 'SHOW server_version_num')"
          if [[ "$server_version_num" != "${POSTGRES_MAJOR}"* ]]; then
            echo "Expected runner-local PostgreSQL ${POSTGRES_MAJOR}; got server_version_num=$server_version_num" >&2
            exit 1
          fi
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS memory_unit_test WITH (FORCE);
          DROP ROLE IF EXISTS activekg_app;
          DROP ROLE IF EXISTS activekg_unit_test;
          CREATE ROLE activekg_unit_test LOGIN SUPERUSER PASSWORD 'activekg';
          CREATE DATABASE memory_unit_test OWNER activekg_unit_test;
          SQL
          identity="$(PGPASSWORD=activekg psql -h 127.0.0.1 -U activekg_unit_test \
            -d memory_unit_test -Atqc \
            "SELECT current_database() || '|' || current_user || '|' || host(inet_server_addr())")"
          if [ "$identity" != "memory_unit_test|activekg_unit_test|127.0.0.1" ]; then
            echo "Runner-local PostgreSQL identity proof failed" >&2
            exit 1
          fi

      - name: Wait for PostgreSQL and initialize schema
        env:
          ACTIVEKG_MIGRATE_DSN: postgresql://activekg_unit_test:activekg@127.0.0.1:5432/memory_unit_test
          ACTIVEKG_MIGRATION_APPLY: "1"
          ACTIVEKG_SCHEMA_FRESH_INIT: "1"
          ACTIVEKG_SCHEMA_TARGET_ID: "22222222-2222-4222-8222-222222222222"
          ACTIVEKG_SCHEMA_ENVIRONMENT: "development"
          ACTIVEKG_SCHEMA_SOURCE_COMMIT: "0000000000000000000000000000000000000000"
          ACTIVEKG_RUNTIME_ROLE: activekg_app
          ACTIVEKG_RUNTIME_PASSWORD: activekg_app_ci
        run: |
          until pg_isready -h localhost -p 5432 -U activekg_unit_test -d memory_unit_test; do
            echo "Waiting for PostgreSQL..."; sleep 2; done
          python scripts/init_railway_db.py
      
      - name: Run unit tests
        env:
          ACTIVEKG_DSN: postgresql://activekg_unit_test:activekg@localhost:5432/memory_unit_test
          ACTIVEKG_SCHEMA_ENVIRONMENT: "development"
          CANDIDATE_PRIVACY_HMAC_ACTIVE_VERSION: "1"
          CANDIDATE_PRIVACY_HMAC_KEY_V1: "Y2ktb25seS1jYW5kaWRhdGUtcHJpdmFjeS1rZXktMzItYnl0ZXMtbWluaW11bQ=="
          CANDIDATE_PRIVACY_INTAKE_ENABLED: "false"
          CANDIDATE_PRIVACY_FLOW_ISSUER: "vantahire"
          CANDIDATE_PRIVACY_FLOW_ACTOR_ID: "vantahire-backend"
          CANDIDATE_PRIVACY_SIGNAL_ISSUER: "signal"
          CANDIDATE_PRIVACY_SIGNAL_ACTOR_ID: "signal-backend"
        run: |
          pytest \
            tests/test_phase1_complete.py \
            tests/test_phase1_plus.py \
            tests/test_base_engine_gaps.py \
            -v --tb=short --timeout=60
        continue-on-error: false

  # ============================================================================
  # Job 3.5: Deploy Path — clean-DB init via the real Railway script
  # ============================================================================
  deploy-path-db:
    name: Deploy Path (clean DB + candidate schema)
    runs-on: ubuntu-latest
    env:
      ACTIVEKG_CONTROL_PLANE_TOKEN: "ci-control-plane-token-for-deploy-path-verification"
      ACTIVEKG_SCHEMA_TARGET_ID: "11111111-1111-4111-8111-111111111111"
      ACTIVEKG_SCHEMA_ENVIRONMENT: "development"
      ACTIVEKG_SCHEMA_SOURCE_COMMIT: "0000000000000000000000000000000000000000"
      CANDIDATE_PRIVACY_HMAC_ACTIVE_VERSION: "1"
      CANDIDATE_PRIVACY_HMAC_KEY_V1: "Y2ktb25seS1jYW5kaWRhdGUtcHJpdmFjeS1rZXktMzItYnl0ZXMtbWluaW11bQ=="
      CANDIDATE_PRIVACY_INTAKE_ENABLED: "false"
      CANDIDATE_PRIVACY_FLOW_ISSUER: "vantahire"
      CANDIDATE_PRIVACY_FLOW_ACTOR_ID: "vantahire-backend"
      CANDIDATE_PRIVACY_SIGNAL_ISSUER: "signal"
      CANDIDATE_PRIVACY_SIGNAL_ACTOR_ID: "signal-backend"
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install -r requirements.txt

      - name: Start runner-local PostgreSQL 16 with pgvector
        run: |
          sudo systemctl start postgresql
          server_version_num="$(sudo -u postgres psql -d postgres -Atqc 'SHOW server_version_num')"
          if [[ "$server_version_num" != 16* ]]; then
            echo "Expected runner-local PostgreSQL 16; got server_version_num=$server_version_num" >&2
            exit 1
          fi
          if [ ! -f /usr/share/postgresql/16/extension/vector.control ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16-pgvector
            sudo systemctl restart postgresql
          fi
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS memory_schema_control_test WITH (FORCE);
          DROP ROLE IF EXISTS activekg_app;
          DROP ROLE IF EXISTS activekg_schema_control_test;
          CREATE ROLE activekg_schema_control_test LOGIN SUPERUSER PASSWORD 'owner-test-only';
          CREATE DATABASE memory_schema_control_test OWNER activekg_schema_control_test;
          SQL
          pg_isready -h 127.0.0.1 -p 5432 -d memory_schema_control_test -U activekg_schema_control_test

      - name: Run the manual release path on a clean disposable database
        env:
          ACTIVEKG_MIGRATE_DSN: postgresql://activekg_schema_control_test:owner-test-only@127.0.0.1:5432/memory_schema_control_test
          ACTIVEKG_MIGRATION_APPLY: "1"
          ACTIVEKG_SCHEMA_FRESH_INIT: "1"
          ACTIVEKG_RUNTIME_ROLE: activekg_app
          ACTIVEKG_RUNTIME_PASSWORD: activekg_app_ci
        run: |
          python scripts/init_railway_db.py

      - name: Re-run init script (idempotency + ledger check)
        env:
          ACTIVEKG_MIGRATE_DSN: postgresql://activekg_schema_control_test:owner-test-only@127.0.0.1:5432/memory_schema_control_test
          ACTIVEKG_MIGRATION_APPLY: "1"
          ACTIVEKG_RUNTIME_ROLE: activekg_app
          ACTIVEKG_RUNTIME_PASSWORD: activekg_app_ci
        run: |
          python scripts/init_railway_db.py

      - name: Assert schema, RLS, ledger and runtime-role posture
        env:
          PGPASSWORD: owner-test-only
        run: |
          for table in candidates candidate_identifiers candidate_source_records candidate_contact_evidence; do
            rls=$(psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -tAc \
              "SELECT relrowsecurity FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname = '$table';")
            if [ "$rls" != "t" ]; then
              echo "FAIL: table $table missing or RLS disabled (got: '$rls')"
              exit 1
            fi
            if [ "$table" = "candidate_contact_evidence" ]; then
              force_rls=$(psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -tAc \
                "SELECT relforcerowsecurity FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relname = '$table';")
              if [ "$force_rls" != "t" ]; then
                echo "FAIL: table $table does not force RLS (got: '$force_rls')"
                exit 1
              fi
            fi
            echo "OK: $table exists with RLS enabled"
          done
          ledger=$(psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -tAc \
            "SELECT count(*) || '|' || count(*) FILTER (WHERE baselined) FROM schema_migrations;")
          if [ "$ledger" != "23|0" ]; then
            echo "FAIL: ledger should have exactly 23 applied and 0 baselined entries on a clean DB (got: '$ledger')"
            exit 1
          fi
          echo "OK: migration ledger has 23 applied, 0 baselined"
          posture=$(psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -tAc \
            "SELECT (NOT rolsuper AND NOT rolbypassrls) FROM pg_roles WHERE rolname = 'activekg_app';")
          if [ "$posture" != "t" ]; then
            echo "FAIL: runtime role posture wrong (got: '$posture', want 't' = not superuser, no bypassrls)"
            exit 1
          fi
          echo "OK: runtime role is NOSUPERUSER NOBYPASSRLS"

      - name: Run disposable Memory schema-control matrix
        env:
          ACTIVEKG_SCHEMA_CONTROL_TEST_OWNER_DSN: postgresql://activekg_schema_control_test:owner-test-only@127.0.0.1:5432/memory_schema_control_test
          ACTIVEKG_SCHEMA_CONTROL_TEST_RUNTIME_DSN: postgresql://activekg_app:activekg_app_ci@127.0.0.1:5432/memory_schema_control_test
        run: |
          pytest tests/test_schema_control_postgres.py -v --tb=short --timeout=240

      - name: Run disposable candidate-privacy authority matrix
        env:
          ACTIVEKG_PRIVACY_TEST_OWNER_DSN: postgresql://activekg_schema_control_test:owner-test-only@127.0.0.1:5432/memory_schema_control_test
          ACTIVEKG_PRIVACY_TEST_RUNTIME_DSN: postgresql://activekg_app:activekg_app_ci@127.0.0.1:5432/memory_schema_control_test
        run: |
          pytest tests/test_candidate_privacy_postgres.py -v --tb=short --timeout=240

      - name: Run RLS enforcement tests as the restricted runtime role
        env:
          ACTIVEKG_RLS_TEST_OWNER_DSN: postgresql://activekg_schema_control_test:owner-test-only@127.0.0.1:5432/memory_schema_control_test
          ACTIVEKG_RLS_TEST_RUNTIME_DSN: postgresql://activekg_app:activekg_app_ci@127.0.0.1:5432/memory_schema_control_test
        run: |
          pytest \
            tests/test_candidate_rls_enforcement.py \
            tests/test_candidate_private_search.py \
            tests/test_public_memory_integration.py \
            -v --tb=short --timeout=60

      - name: Start API under the restricted runtime DSN
        env:
          ACTIVEKG_DSN: postgresql://activekg_app:activekg_app_ci@127.0.0.1:5432/memory_schema_control_test
          JWT_ENABLED: "true"
          JWT_ALGORITHM: HS256
          JWT_SECRET_KEY: "ci-test-secret-key-min-32-chars-long-for-testing-only"
          JWT_AUDIENCE: activekg
          JWT_ISSUER: vantahire
          LLM_ENABLED: "false"
          RUN_SCHEDULER: "false"
          RATE_LIMIT_ENABLED: "false"
          REDIS_URL: redis://localhost:6379/0
        run: |
          uvicorn activekg.api.main:app --host 0.0.0.0 --port 8000 &
          echo $! > api_server.pid
          timeout 90 bash -c 'until curl -fsS http://localhost:8000/health >/dev/null; do sleep 2; done'

      - name: Readiness must pass under the restricted role
        run: |
          body=$(curl -s -w '\n%{http_code}' \
            -H "Authorization: Bearer ${ACTIVEKG_CONTROL_PLANE_TOKEN}" \
            -H "Cache-Control: no-cache" \
            http://localhost:8000/readyz)
          code=$(echo "$body" | tail -1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "FAIL: /readyz returned $code under the restricted runtime role"
            exit 1
          fi

      - name: JWT-backed candidate request through the API
        env:
          JWT_SECRET_KEY: "ci-test-secret-key-min-32-chars-long-for-testing-only"
        run: |
          pip install pyjwt requests >/dev/null
          python3 - <<'PY'
          import os, time, uuid, jwt, requests

          token = jwt.encode(
              {
                  "tenant_id": "ci_rls_tenant",
                  "sub": "ci-test",
                  "actor_type": "service",
                  "scopes": "kg:write kg:read",
                  "jti": str(uuid.uuid4()),
                  "iss": "vantahire",
                  "aud": "activekg",
                  "exp": int(time.time()) + 300,
              },
              os.environ["JWT_SECRET_KEY"],
              algorithm="HS256",
          )
          r = requests.post(
              "http://localhost:8000/candidates/resolve",
              json={
                  "identifiers": [{"identifier_type": "email", "value": "ci-rls@example.com"}],
                  "source": "signal",
                  "source_record_type": "profile",
                  "source_record_id": "ci-rls-1",
              },
              headers={"Authorization": f"Bearer {token}"},
              timeout=30,
          )
          print(r.status_code, r.text[:300])
          assert r.status_code == 200, f"resolve failed: {r.status_code} {r.text[:300]}"

          # Reserved sentinel tenant must be rejected outright.
          bad = jwt.encode(
              {
                  "tenant_id": "__quarantine__",
                  "sub": "ci-test",
                  "actor_type": "service",
                  "scopes": "kg:read",
                  "jti": str(uuid.uuid4()),
                  "iss": "vantahire",
                  "aud": "activekg",
                  "exp": int(time.time()) + 300,
              },
              os.environ["JWT_SECRET_KEY"],
              algorithm="HS256",
          )
          r2 = requests.post(
              "http://localhost:8000/candidates/search/by-tags",
              json={"tags": ["x"]},
              headers={"Authorization": f"Bearer {bad}"},
              timeout=30,
          )
          print("quarantine tenant:", r2.status_code)
          assert r2.status_code == 403, f"expected 403 for __quarantine__, got {r2.status_code}"
          PY

      - name: Readiness must detect tampered policies and ledger
        env:
          PGPASSWORD: owner-test-only
          ACTIVEKG_MIGRATE_DSN: postgresql://activekg_schema_control_test:owner-test-only@127.0.0.1:5432/memory_schema_control_test
          ACTIVEKG_MIGRATION_APPLY: "1"
        run: |
          check_readyz() {
            curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${ACTIVEKG_CONTROL_PLANE_TOKEN}" \
              -H "Cache-Control: no-cache" \
              http://localhost:8000/readyz
          }
          # The two global #12 tables are readiness dependencies even though
          # only tenant contact evidence itself is RLS-scoped.
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE public_candidate_market_memberships RENAME TO public_candidate_market_memberships_tampered;"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code after public table rename (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE public_candidate_market_memberships_tampered RENAME TO public_candidate_market_memberships;"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after public table restore (want 200)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE contact_suppression_receipts ENABLE REPLICA TRIGGER contact_suppression_receipts_no_mutation;"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code with replica-only audit trigger (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE contact_suppression_receipts ENABLE TRIGGER contact_suppression_receipts_no_mutation;"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after audit trigger restore (want 200)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER SEQUENCE contact_suppression_receipts_id_seq RENAME TO contact_suppression_receipts_id_seq_tampered;"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code after receipt sequence rename (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER SEQUENCE contact_suppression_receipts_id_seq_tampered RENAME TO contact_suppression_receipts_id_seq;"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after receipt sequence restore (want 200)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE contact_suppression_receipts DROP CONSTRAINT contact_suppression_receipts_provider_event_unique;
             ALTER TABLE contact_suppression_receipts ADD CONSTRAINT contact_suppression_receipts_provider_event_unique UNIQUE (provider_event_id, issuer);"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code with wrong receipt idempotency key (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE contact_suppression_receipts DROP CONSTRAINT contact_suppression_receipts_provider_event_unique;
             ALTER TABLE contact_suppression_receipts ADD CONSTRAINT contact_suppression_receipts_provider_event_unique UNIQUE (issuer, provider_event_id);"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after receipt idempotency restore (want 200)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE contact_suppression_receipts DROP CONSTRAINT contact_suppression_receipt_authority_check;
             ALTER TABLE contact_suppression_receipts ADD CONSTRAINT contact_suppression_receipt_authority_check CHECK (true);"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code with permissive suppression authority (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE contact_suppression_receipts DROP CONSTRAINT contact_suppression_receipt_authority_check;
             ALTER TABLE contact_suppression_receipts ADD CONSTRAINT contact_suppression_receipt_authority_check
             CHECK (btrim(issuer) <> '' AND btrim(actor_id) <> '' AND actor_type = 'service');"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after suppression authority restore (want 200)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "CREATE OR REPLACE FUNCTION contact_suppression_receipts_append_only()
             RETURNS trigger LANGUAGE plpgsql AS \$\$
             BEGIN RETURN OLD; END;
             \$\$;"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code with no-op append-only function (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "CREATE OR REPLACE FUNCTION contact_suppression_receipts_append_only()
             RETURNS trigger LANGUAGE plpgsql AS \$\$
             BEGIN
               RAISE EXCEPTION 'contact_suppression_receipts is append-only (attempted %)', TG_OP;
             END;
             \$\$;"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after append-only function restore (want 200)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "GRANT UPDATE ON contact_suppression_receipts TO activekg_app;"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code with mutable receipts (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "REVOKE UPDATE ON contact_suppression_receipts FROM activekg_app;"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after receipt privilege restore (want 200)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "GRANT TRUNCATE ON contact_suppression_tombstones TO activekg_app;"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code with erasable tombstones (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "REVOKE TRUNCATE ON contact_suppression_tombstones FROM activekg_app;"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after tombstone privilege restore (want 200)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE global_candidates RENAME COLUMN public_role_family TO public_role_family_tampered;"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code after public column rename (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "ALTER TABLE global_candidates RENAME COLUMN public_role_family_tampered TO public_role_family;"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after public column restore (want 200)"; exit 1; }
          # A policy retaining the expected substrings but adding OR true is
          # still cross-tenant permissive and must fail readiness.
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "DROP POLICY tenant_isolation_candidates ON candidates;
             CREATE POLICY tenant_isolation_candidates ON candidates FOR ALL TO PUBLIC
             USING (
               (tenant_id <> '__quarantine__'
                AND tenant_id = current_setting('app.current_tenant_id', true))
               OR true
             )
             WITH CHECK (
               tenant_id <> '__quarantine__'
               AND tenant_id = current_setting('app.current_tenant_id', true)
             );"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code after permissive policy tamper (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -f db/migrations/017_reserve_quarantine_tenant.sql
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after policy definition restore (want 200)"; exit 1; }
          # Malformed policy: dropping the tenant policy must flip readiness.
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "DROP POLICY tenant_isolation_candidates ON candidates;"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code after policy drop (want 503)"; exit 1; }
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -f db/migrations/017_reserve_quarantine_tenant.sql
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after policy restore (want 200)"; exit 1; }
          # NULL ledger checksum must flip readiness.
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "UPDATE schema_migrations SET checksum = NULL WHERE filename = '018_tenant_nonblank.sql';"
          code=$(check_readyz)
          [ "$code" = "503" ] || { echo "FAIL: readyz=$code with NULL checksum (want 503)"; exit 1; }
          if python scripts/init_railway_db.py; then
            echo "FAIL: release runner accepted a corrupt migration ledger"
            exit 1
          fi
          # This is an intentional CI-tamper repair by the disposable owner,
          # not a release behavior: production releases must never bless a
          # missing/unknown checksum.
          psql -h 127.0.0.1 -U activekg_schema_control_test -d memory_schema_control_test -c \
            "UPDATE schema_migrations
             SET checksum = '46c9da96191a87c3143f73516dd7dcb2f2499dfba9afa2ddce55673842d2db0c'
             WHERE filename = '018_tenant_nonblank.sql';"
          code=$(check_readyz)
          [ "$code" = "200" ] || { echo "FAIL: readyz=$code after checksum repair (want 200)"; exit 1; }
          echo "OK: readiness detects tampered public schema, policies and ledger"
        # the init re-run above needs the migrate DSN
        # (guards tests below run it the same way)

      - name: Stop API server
        if: always()
        run: |
          if [ -f api_server.pid ]; then kill $(cat api_server.pid) || true; fi

      - name: Run deploy-path guard regression tests
        env:
          ACTIVEKG_RLS_TEST_OWNER_DSN: postgresql://activekg_schema_control_test:owner-test-only@127.0.0.1:5432/memory_schema_control_test
          ACTIVEKG_RUNTIME_ROLE: activekg_app
          ACTIVEKG_RUNTIME_PASSWORD: activekg_app_ci
        run: |
          pytest tests/test_deploy_path_guards.py -v --tb=short --timeout=180

      # Repository/endpoint logic tests run as the owner role: they exercise
      # merge/resolve logic, not isolation — isolation is proven above by the
      # dedicated enforcement suite running as the restricted role.
      - name: Run candidate identity tests against the migrated schema
        env:
          ACTIVEKG_DSN: postgresql://activekg_schema_control_test:owner-test-only@127.0.0.1:5432/memory_schema_control_test
          JWT_ENABLED: "false"
          LLM_ENABLED: "false"
          RUN_SCHEDULER: "false"
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest tests/test_candidate_*.py --ignore=tests/test_candidate_rls_enforcement.py -v --tb=short --timeout=60

  # ============================================================================
  # Job 4: E2E Integration Tests with PostgreSQL + Redis
  # ============================================================================
  integration-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Disable cache to ensure clean ML lib installation

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-timeout requests pyjwt
          pip install --no-cache-dir --force-reinstall -r requirements.txt

      - name: Log and verify ML dependency versions
        run: |
          python - <<'PY'
          import torch
          import sentence_transformers
          import transformers
          print("torch:", torch.__version__)
          print("sentence-transformers:", sentence_transformers.__version__)
          print("transformers:", transformers.__version__)

          # Assert correct versions to catch pip cache issues
          assert torch.__version__.startswith("2.5."), f"Expected torch 2.5.x, got {torch.__version__}"
          assert sentence_transformers.__version__.startswith("3.3."), f"Expected sentence-transformers 3.3.x, got {sentence_transformers.__version__}"
          print("✓ ML dependency versions verified")
          PY
          pip show torch sentence-transformers transformers

      - name: Start runner-local PostgreSQL 16 with pgvector
        run: |
          sudo systemctl start postgresql
          server_version_num="$(sudo -u postgres psql -d postgres -Atqc 'SHOW server_version_num')"
          if [[ "$server_version_num" != 16* ]]; then
            echo "Expected runner-local PostgreSQL 16; got server_version_num=$server_version_num" >&2
            exit 1
          fi
          if [ ! -f /usr/share/postgresql/16/extension/vector.control ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16-pgvector
            sudo systemctl restart postgresql
          fi
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS memory_e2e_test WITH (FORCE);
          DROP ROLE IF EXISTS activekg_app;
          DROP ROLE IF EXISTS activekg_e2e_test;
          CREATE ROLE activekg_e2e_test LOGIN SUPERUSER PASSWORD 'activekg_test_password';
          CREATE DATABASE memory_e2e_test OWNER activekg_e2e_test;
          SQL
          identity="$(PGPASSWORD=activekg_test_password psql -h 127.0.0.1 -U activekg_e2e_test \
            -d memory_e2e_test -Atqc \
            "SELECT current_database() || '|' || current_user || '|' || host(inet_server_addr())")"
          if [ "$identity" != "memory_e2e_test|activekg_e2e_test|127.0.0.1" ]; then
            echo "Runner-local PostgreSQL identity proof failed" >&2
            exit 1
          fi
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U activekg_e2e_test -d memory_e2e_test; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      
      - name: Initialize database schema
        env:
          ACTIVEKG_MIGRATE_DSN: postgresql://activekg_e2e_test:activekg_test_password@127.0.0.1:5432/memory_e2e_test
          ACTIVEKG_MIGRATION_APPLY: "1"
          ACTIVEKG_SCHEMA_FRESH_INIT: "1"
          ACTIVEKG_SCHEMA_TARGET_ID: "33333333-3333-4333-8333-333333333333"
          ACTIVEKG_SCHEMA_ENVIRONMENT: "development"
          ACTIVEKG_SCHEMA_SOURCE_COMMIT: "0000000000000000000000000000000000000000"
          ACTIVEKG_RUNTIME_ROLE: activekg_app
          ACTIVEKG_RUNTIME_PASSWORD: activekg_app_ci
        run: |
          python scripts/init_railway_db.py
      
      - name: Start API server in background
        env:
          ACTIVEKG_DSN: postgresql://activekg_app:activekg_app_ci@127.0.0.1:5432/memory_e2e_test
          JWT_ENABLED: "true"
          JWT_SECRET_KEY: "ci-test-secret-key-min-32-chars-long-for-testing-only"
          JWT_ALGORITHM: HS256
          JWT_AUDIENCE: activekg
          JWT_ISSUER: https://ci-test.activekg.local
          RATE_LIMIT_ENABLED: "true"
          REDIS_URL: redis://localhost:6379/0
          LLM_ENABLED: "false"
          RUN_SCHEDULER: "false"
          EMBEDDING_BACKEND: sentence-transformers
          EMBEDDING_MODEL: all-MiniLM-L6-v2
          CANDIDATE_PRIVACY_HMAC_ACTIVE_VERSION: "1"
          CANDIDATE_PRIVACY_HMAC_KEY_V1: "Y2ktb25seS1jYW5kaWRhdGUtcHJpdmFjeS1rZXktMzItYnl0ZXMtbWluaW11bQ=="
          CANDIDATE_PRIVACY_INTAKE_ENABLED: "false"
          CANDIDATE_PRIVACY_FLOW_ISSUER: "vantahire"
          CANDIDATE_PRIVACY_FLOW_ACTOR_ID: "vantahire-backend"
          CANDIDATE_PRIVACY_SIGNAL_ISSUER: "signal"
          CANDIDATE_PRIVACY_SIGNAL_ACTOR_ID: "signal-backend"
        run: |
          uvicorn activekg.api.main:app --host 0.0.0.0 --port 8000 &
          echo $! > api_server.pid
          sleep 10
      
      - name: Wait for API server
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done' || \
          (echo "API server failed to start" && cat api_server.pid && kill $(cat api_server.pid) && exit 1)
      
      - name: Seed evaluation dataset
        env:
          API_URL: http://localhost:8000
          TENANT: ci_test_tenant
          JWT_SECRET_KEY: "ci-test-secret-key-min-32-chars-long-for-testing-only"
          JWT_ALGORITHM: HS256
          JWT_AUDIENCE: activekg
          JWT_ISSUER: https://ci-test.activekg.local
        run: |
          python3 evaluation/datasets/seed_with_jwt.py
      
      - name: Run E2E retrieval tests
        env:
          API_URL: http://localhost:8000
          TENANT: ci_test_tenant
          JWT_SECRET: "ci-test-secret-key-min-32-chars-long-for-testing-only"
          JWT_ALGORITHM: HS256
          JWT_ISSUER: https://ci-test.activekg.local
        run: |
          pytest tests/test_e2e_retrieval.py -v --tb=short --timeout=60
      
      - name: Run E2E smoke test
        env:
          API_URL: http://localhost:8000
          TENANT: ci_test_tenant
          JWT_SECRET: "ci-test-secret-key-min-32-chars-long-for-testing-only"
          JWT_ALGORITHM: HS256
          JWT_ISSUER: https://ci-test.activekg.local
        run: |
          python3 scripts/e2e_api_smoke.py
      
      - name: Verify search coverage
        env:
          API_URL: http://localhost:8000
          TENANT: ci_test_tenant
          JWT_SECRET_KEY: "ci-test-secret-key-min-32-chars-long-for-testing-only"
          JWT_ALGORITHM: HS256
          JWT_AUDIENCE: activekg
          JWT_ISSUER: https://ci-test.activekg.local
        run: |
          python3 evaluation/datasets/seed_with_jwt.py --verify-only
      
      - name: Stop API server
        if: always()
        run: |
          if [ -f api_server.pid ]; then
            kill $(cat api_server.pid) || true
          fi

  # ============================================================================
  # Job 5: Performance Benchmarks (Optional, only on main)
  # ============================================================================
