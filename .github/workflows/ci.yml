          name: benchmark-results
          path: evaluation/latency_results.json
        if: always()

  # ============================================================================
  # Job 6: Security Scanning
  # ============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt
      
      - name: Run safety check (dependency vulnerabilities)
        run: |
          safety check --json || true
        continue-on-error: true
      
      - name: Run bandit (code security)
        run: |
          bandit -r activekg/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
        if: always()

  # ============================================================================
  # Job 7: Build Status Summary
  # ============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, fast-unit-tests, unit-tests, deploy-path-db, integration-tests]
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "Build Summary:"
          echo "  Lint: ${{ needs.lint.result }}"
          echo "  Fast Unit Tests: ${{ needs.fast-unit-tests.result }}"
          echo "  Unit Tests (DB): ${{ needs.unit-tests.result }}"
          echo "  Deploy Path (DB): ${{ needs.deploy-path-db.result }}"
          echo "  Integration Tests: ${{ needs.integration-tests.result }}"

          if [ "${{ needs.fast-unit-tests.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.deploy-path-db.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "❌ Build failed - required jobs did not pass"
            exit 1
          else
            echo "✅ Build successful - all required checks passed"
          fi
