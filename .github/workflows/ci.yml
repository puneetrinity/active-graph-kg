          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS memory_benchmark_test WITH (FORCE);
          DROP ROLE IF EXISTS activekg_app;
          DROP ROLE IF EXISTS activekg_benchmark_test;
          CREATE ROLE activekg_benchmark_test LOGIN SUPERUSER PASSWORD 'activekg_bench_password';
          CREATE DATABASE memory_benchmark_test OWNER activekg_benchmark_test;
          SQL
          identity="$(PGPASSWORD=activekg_bench_password psql -h 127.0.0.1 \
            -U activekg_benchmark_test -d memory_benchmark_test -Atqc \
            "SELECT current_database() || '|' || current_user || '|' || host(inet_server_addr())")"
          if [ "$identity" != "memory_benchmark_test|activekg_benchmark_test|127.0.0.1" ]; then
            echo "Runner-local PostgreSQL identity proof failed" >&2
            exit 1
          fi
      
      - name: Initialize database
        env:
          ACTIVEKG_MIGRATE_DSN: postgresql://activekg_benchmark_test:activekg_bench_password@127.0.0.1:5432/memory_benchmark_test
          ACTIVEKG_MIGRATION_APPLY: "1"
          ACTIVEKG_SCHEMA_FRESH_INIT: "1"
          ACTIVEKG_SCHEMA_TARGET_ID: "44444444-4444-4444-8444-444444444444"
          ACTIVEKG_SCHEMA_ENVIRONMENT: "development"
          ACTIVEKG_SCHEMA_SOURCE_COMMIT: "0000000000000000000000000000000000000000"
          ACTIVEKG_RUNTIME_ROLE: activekg_app
          ACTIVEKG_RUNTIME_PASSWORD: activekg_app_ci
        run: |
          python scripts/init_railway_db.py
      
      - name: Start API server
        env:
          ACTIVEKG_DSN: postgresql://activekg_app:activekg_app_ci@127.0.0.1:5432/memory_benchmark_test
          JWT_ENABLED: "false"
          LLM_ENABLED: "false"
          RUN_SCHEDULER: "false"
          CANDIDATE_PRIVACY_HMAC_ACTIVE_VERSION: "1"
          CANDIDATE_PRIVACY_HMAC_KEY_V1: "Y2ktb25seS1jYW5kaWRhdGUtcHJpdmFjeS1rZXktMzItYnl0ZXMtbWluaW11bQ=="
          CANDIDATE_PRIVACY_INTAKE_ENABLED: "false"
          CANDIDATE_PRIVACY_FLOW_ISSUER: "vantahire"
          CANDIDATE_PRIVACY_FLOW_ACTOR_ID: "vantahire-backend"
          CANDIDATE_PRIVACY_SIGNAL_ISSUER: "signal"
          CANDIDATE_PRIVACY_SIGNAL_ACTOR_ID: "signal-backend"
        run: |
          uvicorn activekg.api.main:app --host 0.0.0.0 --port 8000 &
          echo $! > api_server.pid
          sleep 5

      - name: Wait for API server
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8000/health; do echo "Waiting for API..."; sleep 3; done' || \
          (echo "API server failed to start"; cat api_server.pid; kill $(cat api_server.pid) || true; exit 1)
      
      - name: Run latency benchmarks
        env:
          API_URL: http://localhost:8000
          TENANT: bench_tenant
