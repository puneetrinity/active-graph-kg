name: Test Scoring Modes

on:
  push:
    branches: [ main, dev, feat/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-scoring-modes:
    name: Test ${{ matrix.mode }} mode (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
        mode: ["rrf", "cosine"]
      fail-fast: false

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Start runner-local PostgreSQL 16 with pgvector
        run: |
          sudo systemctl start postgresql
          server_version_num="$(sudo -u postgres psql -d postgres -Atqc 'SHOW server_version_num')"
          if [[ "$server_version_num" != 16* ]]; then
            echo "Expected runner-local PostgreSQL 16; got server_version_num=$server_version_num" >&2
            exit 1
          fi
          if [ ! -f /usr/share/postgresql/16/extension/vector.control ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16-pgvector
            sudo systemctl restart postgresql
          fi
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS memory_scoring_test WITH (FORCE);
          DROP ROLE IF EXISTS activekg_app;
          DROP ROLE IF EXISTS activekg_scoring_test;
          CREATE ROLE activekg_scoring_test LOGIN SUPERUSER PASSWORD 'activekg-scoring-owner';
          CREATE DATABASE memory_scoring_test OWNER activekg_scoring_test;
          SQL
          identity="$(PGPASSWORD=activekg-scoring-owner psql -h 127.0.0.1 \
            -U activekg_scoring_test -d memory_scoring_test -Atqc \
            "SELECT current_database() || '|' || current_user || '|' || host(inet_server_addr())")"
          if [ "$identity" != "memory_scoring_test|activekg_scoring_test|127.0.0.1" ]; then
            echo "Runner-local PostgreSQL identity proof failed" >&2
            exit 1
          fi

      - name: Initialize database through the release authority
        env:
          ACTIVEKG_MIGRATE_DSN: postgresql://activekg_scoring_test:activekg-scoring-owner@127.0.0.1:5432/memory_scoring_test
          ACTIVEKG_MIGRATION_APPLY: "1"
          ACTIVEKG_SCHEMA_FRESH_INIT: "1"
          ACTIVEKG_SCHEMA_TARGET_ID: "55555555-5555-4555-8555-555555555555"
          ACTIVEKG_SCHEMA_ENVIRONMENT: development
          ACTIVEKG_SCHEMA_SOURCE_COMMIT: "0000000000000000000000000000000000000000"
          ACTIVEKG_RUNTIME_ROLE: activekg_app
          ACTIVEKG_RUNTIME_PASSWORD: activekg_app_ci
        run: |
          python scripts/init_railway_db.py

      - name: Configure RRF mode
        if: matrix.mode == 'rrf'
        run: |
          echo "HYBRID_RRF_ENABLED=true" >> $GITHUB_ENV
          echo "RRF_LOW_SIM_THRESHOLD=0.01" >> $GITHUB_ENV
          echo "ASK_SIM_THRESHOLD=0.01" >> $GITHUB_ENV
          echo "HYBRID_RRF_K=60" >> $GITHUB_ENV
          echo "HYBRID_RERANKER_BASE=20" >> $GITHUB_ENV
          echo "HYBRID_RERANKER_BOOST=45" >> $GITHUB_ENV
          echo "HYBRID_ADAPTIVE_THRESHOLD=0.55" >> $GITHUB_ENV
          echo "MAX_RERANK_BUDGET_MS=250" >> $GITHUB_ENV

      - name: Configure cosine mode
        if: matrix.mode == 'cosine'
        run: |
          echo "HYBRID_RRF_ENABLED=false" >> $GITHUB_ENV
          echo "RAW_LOW_SIM_THRESHOLD=0.15" >> $GITHUB_ENV
          echo "ASK_SIM_THRESHOLD=0.20" >> $GITHUB_ENV
          echo "RERANK_SKIP_TOPSIM=0.80" >> $GITHUB_ENV

      - name: Set common environment
        run: |
          echo "ACTIVEKG_DSN=postgresql://activekg_app:activekg_app_ci@127.0.0.1:5432/memory_scoring_test" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "JWT_ENABLED=false" >> $GITHUB_ENV
          echo "RATE_LIMIT_ENABLED=false" >> $GITHUB_ENV
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> $GITHUB_ENV
            echo "LLM_ENABLED=true" >> $GITHUB_ENV
            echo "LLM_BACKEND=groq" >> $GITHUB_ENV
            echo "LLM_MODEL=llama-3.1-8b-instant" >> $GITHUB_ENV
          else
            echo "LLM_ENABLED=false" >> $GITHUB_ENV
          fi
          echo "RUN_SCHEDULER=false" >> $GITHUB_ENV
          echo "AUTO_EMBED_ON_CREATE=true" >> $GITHUB_ENV
          echo "ACTIVEKG_DEV_TENANT=default" >> $GITHUB_ENV
          echo "PYTHONDONTWRITEBYTECODE=1" >> $GITHUB_ENV
          echo "EMBEDDING_BACKEND=sentence-transformers" >> $GITHUB_ENV
          echo "EMBEDDING_MODEL=all-MiniLM-L6-v2" >> $GITHUB_ENV
          echo "CANDIDATE_PRIVACY_HMAC_ACTIVE_VERSION=1" >> $GITHUB_ENV
          echo "CANDIDATE_PRIVACY_HMAC_KEY_V1=Y2ktb25seS1jYW5kaWRhdGUtcHJpdmFjeS1rZXktMzItYnl0ZXMtbWluaW11bQ==" >> $GITHUB_ENV
          echo "CANDIDATE_PRIVACY_INTAKE_ENABLED=false" >> $GITHUB_ENV
          echo "CANDIDATE_PRIVACY_FLOW_ISSUER=vantahire" >> $GITHUB_ENV
          echo "CANDIDATE_PRIVACY_FLOW_ACTOR_ID=vantahire-backend" >> $GITHUB_ENV
          echo "CANDIDATE_PRIVACY_SIGNAL_ISSUER=signal" >> $GITHUB_ENV
          echo "CANDIDATE_PRIVACY_SIGNAL_ACTOR_ID=signal-backend" >> $GITHUB_ENV

      - name: Start API server
        run: |
          uvicorn activekg.api.main:app --host 0.0.0.0 --port 8000 --workers 1 > api_server.log 2>&1 &
          echo $! > api_server.pid

          # Wait for server to be healthy
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ API server is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ API server failed to start"
              cat api_server.log
              exit 1
            fi
            sleep 2
          done

      - name: Seed test data
        run: |
          # Seed using evaluation seed nodes if available
          if [ -f "evaluation/datasets/seed_nodes.json" ]; then
            python3 -c "
          import json
          import requests
          import time

          with open('evaluation/datasets/seed_nodes.json') as f:
              nodes = json.load(f)

          seeded = 0
          for node in nodes:
              try:
                  resp = requests.post('http://localhost:8000/nodes', json=node, timeout=10)
                  if resp.status_code in [200, 201]:
                      seeded += 1
                  time.sleep(0.1)  # Rate limit
              except Exception as e:
                  print(f'Warning: Failed to seed node: {e}')

          print(f'✓ Seeded {seeded}/{len(nodes)} nodes')
          "
          else
            echo "⚠ No seed_nodes.json found, skipping seeding"
          fi

      - name: Run scoring mode tests
        run: |
          pytest tests/test_grounded_qa_remote_content_retirement.py -v --tb=short --color=yes

      - name: Run smoke tests
        run: |
          echo "=== Smoke Test 1: Hybrid search ==="
          curl -s -X POST http://localhost:8000/search \
            -H "Content-Type: application/json" \
            -d '{"query":"machine learning engineer frameworks","use_hybrid":true,"top_k":5}' \
            | python3 -m json.tool

          echo ""
          echo "=== Smoke Test 2: Vector-only search ==="
          curl -s -X POST http://localhost:8000/search \
            -H "Content-Type: application/json" \
            -d '{"query":"machine learning engineer frameworks","use_hybrid":false,"top_k":5}' \
            | python3 -m json.tool

          echo ""
          echo "=== Smoke Test 3: Grounded Q&A retirement ==="
          curl -s -X POST http://localhost:8000/ask \
            -H "Content-Type: application/json" \
            -d '{"question":"ignored"}' | python3 -m json.tool

          echo ""
          echo "=== Smoke Test 4: Embedding configuration ==="
          curl -s http://localhost:8000/debug/embed_info \
            | python3 -c "import sys, json; d=json.load(sys.stdin); print(json.dumps({'backend': d.get('backend'), 'model': d.get('model'), 'dimension': d.get('vector_dimension',{}).get('db_dim')}, indent=2))"

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.mode }}-py${{ matrix.python-version }}
          path: api_server.log

      - name: Stop server
        if: always()
        run: |
          if [ -f api_server.pid ]; then
            kill $(cat api_server.pid) 2>/dev/null || true
          fi
          pkill -f "uvicorn activekg" 2>/dev/null || true
